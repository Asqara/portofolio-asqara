# Cloudflare Tunnel -> nginx (:80) -> app container (127.0.0.1:3000).
# Copy to /etc/nginx/conf.d/ (or sites-available + symlink), then:
#   sudo nginx -t && sudo systemctl reload nginx

upstream portofolio_asqara {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name asqara.tech www.asqara.tech;

    # Visitor IP as forwarded by the Cloudflare Tunnel connector on this host.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;

    location / {
        proxy_pass http://portofolio_asqara;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
