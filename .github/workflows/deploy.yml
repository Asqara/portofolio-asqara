name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: vars.DOCKER_PLATFORM != '' && vars.DOCKER_PLATFORM != 'linux/amd64'

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        run: |
          repo="${REGISTRY}/${IMAGE_NAME,,}"
          echo "ref=${repo}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write # OIDC token for Tailscale workload identity federation
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/server/apps/portofolio-asqara' }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH over Tailscale
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fails fast on a malformed secret; compare this fingerprint with
          # `ssh-keygen -lf ~/.ssh/authorized_keys` on the server.
          ssh-keygen -lf ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host homelab
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config
          ssh homelab 'echo "connected to $(hostname)"'

      - name: Upload compose file
        run: |
          ssh homelab "mkdir -p ${DEPLOY_PATH}"
          scp deploy/docker-compose.yml "homelab:${DEPLOY_PATH}/docker-compose.yml"

      - name: Pull and restart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Values go through stdin, not argv, so the token never shows up in `ps` on the server.
          {
            printf 'deploy_path=%q image=%q ghcr_user=%q ghcr_token=%q\n' \
              "$DEPLOY_PATH" "$IMAGE" "$GHCR_USER" "$GHCR_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail
          deploy_path="${deploy_path/#\~/$HOME}"
          cd "$deploy_path"

          touch .env
          if grep -q '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=${image}|" .env
          else
            echo "IMAGE=${image}" >> .env
          fi

          echo "$ghcr_token" | docker login ghcr.io -u "$ghcr_user" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT

          docker compose pull
          docker compose up -d --remove-orphans --wait --wait-timeout 120
          docker image prune -f
          docker compose ps
          REMOTE
          } | ssh homelab bash -s

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
